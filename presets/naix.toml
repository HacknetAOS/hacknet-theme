id = "naix"
name = "Naix"
description = "Amber console variant."

[palette]
bg = "#0a0805"
panel = "#120f0a"
panel_alt = "#181410"
fg = "#ded9cf"
dim = "#8f8472"
faint = "#332a1e"
accent = "#d09a48"
accent_dim = "#4a361a"
accent_glow = "#f4cd8a"
alert = "#e0473a"
warn = "#e0b040"
ok = "#2fbf71"
grid = "#2a2216"
selection = "#41301a"
terminal_fg = "#f4cd8a"

[typography]
mono = "JetBrainsMono Nerd Font"
ui = "Noto Sans"
mono_size = 11
ui_size = 11
title_size = 12
scale = 1.0

[effects]
scanlines = 0.06
glow = 0.0
grid = 0.10
border = 1
panel_opacity = 1.0
corner_bracket = 0

[terminal]
cursor = "block"
blink = true
